defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    # Actor and rollout share all eight GPUs; Harbor supplies rewards.
    actor,rollout,reward: 0-7

runner:
  task_type: reasoning
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 100000
  max_steps: 200

  val_check_interval: -1
  save_interval: 5

  seq_length: 32768 # Total token budget for a multi-turn trajectory.

  enable_dynamic_batch_size: True
  max_tokens_per_mbs: 32768

  resume_dir: null
  experiment_name: qwen3-harbor-swe
  output_dir: ./logs

algorithm:
  group_size: 8 # Trajectories sampled per question.

  n_minibatches: 1
  training_batch_size_per_gpu: 1 # Training micro-batch size.
  rollout_batch_size_per_gpu: null # Divide the batch across rollout instances.

  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 4

  recompute_logprobs: False # Use logprobs recorded by the session gateway.
  shuffle_rollout: False

  # GRPO loss parameters.
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: False
  clip_ratio_c: null
  clip_ratio_high: 0.28

  adv_type: grpo
  advantage_mode: trajectory
  normalize_advantages: False
  early_stop_imp_ratio: 5.0
  use_valid_token_scale: True

  # Sampling parameters for each model call.
  sampling_params:
    do_sample: True
    temperature: 0.7
    top_k: 1000000
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 4096
    min_new_tokens: 1
    stop: null

rollout:
  group_name: "RolloutGroup"

  gpu_memory_utilization: 0.5
  weight_reload: sync

  model:
    model_path: /models/Qwen3-30B-A3B-Instruct-2507
    model_type: qwen3_moe
    precision: bf16
  enforce_eager: False # Capture CUDA graphs during engine initialization.
  distributed_executor_backend: mp
  disable_log_stats: False
  detokenize: True
  padding: null # Use tokenizer.pad_token_id.
  eos: null # Use tokenizer.eos_token_id.

  rollout_backend: sglang

  sglang:
    attention_backend: triton
    decode_log_interval: 500000
    use_torch_compile: False
    torch_compile_max_bs: 128

    # Expert parallelism and attention data parallelism within the TP group.
    enable_ep_moe: True
    ep_size: 8
    moe_dp_size: 1
    dp_size: 2
    enable_dp_attention: True
    moe_dense_tp_size: 1
    moe_a2a_backend: none
    return_generation_errors: True # Return per-request failures to the session gateway.

  return_logprobs: True

  tensor_parallel_size: 8
  pipeline_parallel_size: 1

  validate_weight_first_sync: True
  validate_weight: False
  validate_save_dir: null
  print_outputs: False

  max_running_requests: 16 # Concurrent model requests within SGLang.
  cuda_graph_max_bs: 16

data:
  type: reasoning
  max_prompt_length: 6144 # Initial prompt budget; later turns use runner.seq_length.
  filter_prompt_by_length: False
  rollout_batch_size: 8 # Questions per batch; group_size=8 gives 64 trajectories.
  val_rollout_batch_size: null
  num_workers: 0
  prompt_key: prompt
  answer_key: solutions
  apply_chat_template: False # The session gateway renders the conversation.
  shuffle: True
  validation_shuffle: True
  seed: 1234
  train_data_paths: ["/data/swe-training/train.jsonl"]

agentloop:
  group_name: AgentLoopGroup
  print_outputs: False
  is_dynamic_rollout_batch: False
  agentic_tokenizer: qwen
  chat_template_kwargs:
    enable_thinking: False

  harbor:
    server_url: http://127.0.0.1:30200
    model_name: openai/policy
    max_concurrency: 32 # Concurrent sandbox trials.

    # Allow the server to finish cancellation and cleanup before the client expires.
    trial_timeout_s: 8400
    client_timeout_s: 8460
    cleanup_timeout_s: 40
    max_retries: 0
    max_consecutive_aborted_batches: 32

    gateway_host: 0.0.0.0
    gateway_port: 30300
    gateway_advertise_host: null # Use the Ray node IP visible from the sandboxes.
    artifacts_dir: ./logs/qwen3-harbor-swe/trajectories

actor:
  group_name: "ActorGroup"
  training_backend: megatron
  mcore_gpt: True
  spec_name: decoder_gpt

  offload_optimizer: True
  offload_weight: True
  offload_grad: True

  enable_dp_load_balance: True
  calculate_flops: False
  seed: 42

  model:
    model_type: qwen3_moe
    megatron_checkpoint: null
    precision: bf16

    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    moe_grouped_gemm: te

    activation: swiglu
    sequence_parallel: True

    # Recompute each transformer layer during backward to reduce activation memory.
    recompute_method: uniform
    recompute_granularity: full
    recompute_num_layers: 1

    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}

    normalization: rmsnorm
    position_embedding_type: rope

    apply_rope_fusion: False
    bias_dropout_fusion: False
    persist_layer_norm: False
    bias_activation_fusion: False
    attention_softmax_in_fp32: True
    batch_p2p_comm: False
    variable_seq_lengths: True
    gradient_accumulation_fusion: False
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: False

    moe_aux_loss_coeff: 0

  optim:
    optimizer: adam
    bf16: False
    fp16: False
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_eps: 1.0e-08
    min_lr: 0.0
    weight_decay: 0.1
    use_distributed_optimizer: True
    overlap_grad_reduce: True
    overlap_param_gather: True
    optimizer_enable_pin: False
    overlap_param_gather_with_optimizer_step: False
    clip_grad: 1.0
    loss_scale: 65536

    # Keep optimizer states on CPU while actor and rollout reuse the GPUs.
    optimizer_cpu_offload: True
    optimizer_offload_fraction: 1.0
    use_precision_aware_optimizer: True

  lr_sched:
    lr_warmup_fraction: 0.0
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 1.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10

  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: False
    trust_remote_code: True
    padding_side: right

  megatron:
    mbridge: True
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 30
    ckpt_format: torch
    use_dist_ckpt: False
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    use_hf_ckpt: True # Initialize training weights from the Hugging Face model.
    use_profiler: False
    accumulate_allreduce_grads_in_fp32: True

    ckpt_convertor:
      model: Qwen3-30B-A3B
      hf_model_path: ${rollout.model.model_path}
      save_path: ${runner.output_dir}/${runner.experiment_name}/converted_ckpts/actor

critic:
  use_critic_model: False
